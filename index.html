  DEUCIFY — Aplikasi skor tennis (by reshafandy)
  =============================================================
  Satu file HTML mandiri (tanpa library luar). Cukup unggah sebagai index.html.

  PETA FILE (cari kata kunci "N." di dalam file):
    CSS   1-15  : warna/tema, papan skor, tombol, popup, menu, slider, splash
    HTML        : splash, header logo, #menu, #play, popup win/cfg/lb, credit
    JS    1     : konfigurasi, state S, helper
          2     : mode Tennis Americano (acak ronde, peringkat)
          3     : logika skor (point, winGame, label, sub)
          4     : tampilan layar permainan (render)
          5     : tombol-tombol layar permainan
          6     : layar menu (MODES, show, renderMenu, check, openEnd)
          7     : bahasa ID/EN (kamus E, pola R, tr, applyLang)
          8     : start
    DATA LOGO   : paling bawah file (base64, jangan diedit)

  CARA CEPAT MENCARI:
    Ubah warna            → CSS bagian 1 (:root)
    Ubah aturan skor      → JS bagian 3 (point, winGame)
    Ubah teks Indonesia   → cari teksnya langsung (MODES di JS 6, atau di renderMenu)
    Ubah teks Inggris     → JS bagian 7 (kamus E / pola R)
    Tambah mode           → JS 6 (MODES) + JS 3 (aturan) + render() di JS 4
    Bug tampilan menu     → renderMenu() ; bug skor → point()/winGame() ; bug peringkat → saveMatch()/ranking()

<style>
/* ============================================================
 * 1. VARIABEL WARNA / TEMA — ubah warna aplikasi cukup di sini (--bg, --a, --b, dst.)
 * ============================================================ */
:root {
  --bg: #1c462e;
  --card: #25573b;
  --ink: #ece6cd;
  --mute: #aebfa6;
  --a: #daa724;
  --b: #e9e2c6;
  --onA:#17301f;
  --line: #356b4b;
  --hl: #2f6a49;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}

/* ============================================================
 * 2. RESET & LAYOUT DASAR
 * ============================================================ */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px;
  user-select: none;
}

/* ============================================================
 * 3. PAPAN SKOR (bagian atas layar permainan)
 * ============================================================ */
.board {
  background: var(--card);
  border-radius: 16px;
  padding: 8px 12px;
  border: 1px solid var(--line);
}

.row {
  display: grid;
  grid-template-columns: 1fr repeat(4,34px) 44px;
  align-items: center;
  gap: 4px;
  padding: 6px 0;
  font-variant-numeric: tabular-nums;
}

.row.d {
  grid-template-columns: 1fr 54px;
}

.row+.row {
  border-top: 1px solid var(--line);
}

.row.h {
  font-size: 11px;
  color: var(--mute);
  padding: 2px 0;
  text-transform: uppercase;
  letter-spacing: .05em;
}

.row .c {
  text-align: center;
  font-size: 18px;
}

.row .c.cur {
  font-weight: 800;
  font-size: 22px;
  background: var(--hl);
  border-radius: 8px;
}

.nm {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 17px;
  overflow: hidden;
  white-space: nowrap;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: transparent;
  flex: none;
}

.dot.on {
  background: var(--a);
  box-shadow: 0 0 0 2px var(--line);
}

/* ============================================================
 * 4. BARIS STATUS (servis, ronde, game)
 * ============================================================ */
.status {
  text-align: center;
  font-size: 13px;
  color: var(--mute);
  min-height: 18px;
  line-height: 1.5;
}

.status b {
  color: var(--ink);
}

/* ============================================================
 * 5. TOMBOL TAP BESAR (area untuk menambah poin)
 * ============================================================ */
.pads {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
}

.pad {
  flex: 1;
  border: 0;
  border-radius: 20px;
  color: var(--onA);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  cursor: pointer;
  font-family: inherit;
  transition: transform .08s;
}

.pad:active {
  transform: scale(.98);
}

.pad.a {
  background: var(--a);
}

.pad.b {
  background: var(--b);
}

.pad .n {
  font-size: 18px;
  font-weight: 600;
  opacity: .9;
}

.pad .p {
  font-size: min(22vw,110px);
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.pad .t {
  font-size: 14px;
  opacity: .9;
  font-weight: 600;
}

/* ============================================================
 * 6. BAR TOMBOL BAWAH (Urungkan, Server, Skor, Selesai)
 * ============================================================ */
.bar {
  display: flex;
  gap: 8px;
}

.bar button {
  flex: 1;
  padding: 13px 4px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}

.bar button:disabled {
  opacity: .4;
}

/* ============================================================
 * 7. POPUP / OVERLAY (hasil match, peringkat, konfirmasi selesai)
 * ============================================================ */
.win {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 20;
}

.win.show {
  display: flex;
}

.win>div {
  background: var(--card);
  border-radius: 20px;
  padding: 24px;
  text-align: center;
  max-width: 380px;
  width: 100%;
  max-height: 100%;
  overflow: auto;
}

.win h2 {
  margin: 0 0 6px;
  font-size: 24px;
}

.win p {
  color: var(--mute);
  margin: 0 0 16px;
  font-size: 14px;
}

.win button.m {
  padding: 12px 20px;
  border-radius: 12px;
  border: 0;
  background: var(--a);
  color: var(--onA);
  font-size: 16px;
  font-weight: 700;
  font-family: inherit;
  margin: 4px;
  cursor: pointer;
}

.win button.g {
  background: var(--line);
  color: var(--ink);
}

/* ============================================================
 * 8. TOMBOL PILIHAN (segmented: Single/Double, jumlah set)
 * ============================================================ */
.seg {
  display: flex;
  gap: 6px;
  margin: 10px 0;
}

.seg button {
  flex: 1;
  padding: 10px 4px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.seg button.on {
  background: var(--a);
  border-color: var(--a);
  color: var(--onA);
}

.win label,#menu label {
  display: block;
  text-align: left;
  font-size: 12px;
  color: var(--mute);
  margin: 10px 0 4px;
}

.win input,.win textarea,#menu input,#menu textarea {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  font-family: inherit;
  user-select: text;
}

.hint {
  text-align: left!important;
}

/* ============================================================
 * 9. PESAN ERROR MERAH
 * ============================================================ */
.err {
  color: #ff9b86;
  font-size: 14px;
  margin: 6px 0 0;
  text-align: left;
  font-weight: 600;
}

.err:empty {
  display: none;
}

/* ============================================================
 * 10. TABEL PERINGKAT (Americano)
 * ============================================================ */
.lr {
  display: grid;
  grid-template-columns: 30px 1fr 48px 48px 40px;
  gap: 4px;
  align-items: center;
  padding: 8px 0;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.lr+.lr {
  border-top: 1px solid var(--line);
}

.lr .nmL {
  text-align: left;
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.lr.h {
  font-size: 11px;
  color: var(--mute);
  text-transform: uppercase;
  padding: 2px 0;
}

.lr .pt {
  font-weight: 800;
  font-size: 18px;
}

.lr.top1 {
  background: var(--hl);

<script>
/* ============================================================
 * 1. KONFIGURASI, DATA AWAL & STATE
 * Variabel penting (nama pendek!):
 *   S         = state pertandingan yang sedang berjalan (bentuknya lihat mk()).
 *   stack     = daftar snapshot S sebelumnya, untuk tombol Urungkan.
 *   hasSaved  = ada pertandingan tersimpan? (untuk kartu "Lanjutkan pertandingan").
 *   lang      = "id" | "en".   screen = "home" | "info" | "setup" | "play".
 *   pick      = mode yang dipilih di menu.   D = draft isian form pengaturan.
 * Alur umum: tap → point() → winGame() → save() → render().
 * ============================================================ */
const KEY="skor-tennis-v2";
let lang = "id"; // bahasa aktif: "id" | "en" (disimpan di localStorage "skor-lang")
try {
  if (localStorage.getItem("skor-lang") === "en") lang = "en";
} catch (e) {}
/** Singkatan getElementById. Contoh: $("board") */
const $=id=>document.getElementById(id);
const DS = ["Pemain 1", "Pemain 2"];              // nama bawaan mode standar
const DD = ["Rina", "Budi", "Sari", "Andi"];       // nama bawaan mode double
const DN = "Rina, Budi, Sari, Andi, Dewi, Agus";   // nama bawaan mode Americano
/** Membuat objek state pertandingan baru.
 * mode: "std" | "dbl" | "ame". std = [nama1, nama2]. dbl = [A1, A2, B1, B2] (kosongkan A2/B2 untuk single). */
function mk(mode, bo, std, dbl) {
  return {
    mode,                    // "std" | "dbl" | "ame"
    bo,                      // best of N set (hanya mode std)
    names: std.slice(),      // nama sisi 1 & 2 (mode std)
    pl: [                    // pemain per tim (mode dbl/ame); single = 1 nama
      [dbl[0], dbl[1]].filter(Boolean),
      [dbl[2], dbl[3]].filter(Boolean),
    ],
    p: [0, 0],               // poin game berjalan (0,1,2,3,4...)
    g: [0, 0],               // game (std: dalam set berjalan; dbl/ame: total game)
    sw: [0, 0],              // set dimenangkan (mode std)
    hist: [],                // skor set yang sudah selesai (mode std)
    tb: false,               // sedang tiebreak? (mode std)
    tbStart: 0,              // yang servis pertama di tiebreak
    server: 0,               // sisi yang servis: 0 / 1
    srv: 0,                  // indeks urutan servis 0..3 (mode dbl/ame)
    gp: 0,                   // jumlah game selesai (mode dbl/ame)
    dc: 0,                   // hitungan deuce di game ini
    dl: mode !== "std" ? 2 : 0, // batas deuce: 0 = tak terbatas, 2 = maks 2, 1 = Sudden
    dp: false,               // poin berikutnya = poin penentu?
    final: false,            // game penentu ekstra saat seri 2-2 (dbl/ame)
    over: false,             // match selesai?
    winner: null,            // 0 / 1 setelah selesai
  };
}
let S=mk("std",3,DS,DD),stack=[],hasSaved=false;
try {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    const saved = JSON.parse(raw);
    if (saved && saved.s && saved.s.mode) {
      S = saved.s;
      stack = saved.stack || [];
      hasSaved = true;
    }
  }
} catch (e) {}
/** Simpan S + riwayat undo ke localStorage supaya pertandingan bisa dilanjutkan. */
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ s: S, stack: stack.slice(-40) }));
  } catch (e) {}
}
/** Salin dalam (deep copy) objek — dipakai untuk snapshot Urungkan. */
const clone=o=>JSON.parse(JSON.stringify(o));
/** true bila mode bukan "std" (jadi dbl atau ame) — mode yang memakai 4 game. */
const dbl=()=>S.mode!=="std";
/** true bila mode Tennis Americano. */
const ame=()=>S.mode==="ame";
/** Nama tampilan sisi i (tim "A / B" atau nama pemain). */
const tn=i=>dbl()?S.pl[i][0]+" / "+S.pl[i][1]:S.names[i];
/** Escape HTML supaya nama pemain aman dipasang ke innerHTML. */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/** Acak urutan array (Fisher–Yates), mengubah array aslinya. */
const shuf = (a) => {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
/** Kunci pasangan 2 pemain tanpa peduli urutan (untuk hitungan pasangan/lawan). */
const pk=(x,y)=>[x,y].sort().join("|");

/* ============================================================
 * 2. MODE TENNIS AMERICANO
 * Pemain banyak, pasangan diacak tiap ronde, poin tiap pemain = game yang dimenangkan timnya.
 * State turnamen ada di S.ame: { players, total, round, fx[], rest[], cur, pts{}, mp{}, w{}, pr{}, op{}, finished }.
 * ============================================================ */

/** Acak 1 ronde Americano: pilih yang main (yang sering istirahat didahulukan), lalu cari pasangan
 * dengan jumlah pasangan/lawan berulang paling sedikit (400 percobaan acak). */
function genRound(a){
  const n=a.players.length,courts=Math.floor(n/4),need=courts*4;
  const order=shuf(a.players.slice()).sort((x,y)=>a.mp[x]-a.mp[y]);
  const playing=order.slice(0,need);a.rest=order.slice(need);
  let best=null,bs=1e9;
  for(let t=0;t<400&&bs>0;t++){
    const s=shuf(playing.slice());let sc=0;
    for(let c=0;c<courts;c++){
      const[q1,q2,q3,q4]=s.slice(c*4,c*4+4);
      sc+=3*((a.pr[pk(q1,q2)]||0)+(a.pr[pk(q3,q4)]||0));
      [[q1,q3],[q1,q4],[q2,q3],[q2,q4]].forEach(([x,y])=>{sc+=a.op[pk(x,y)]||0});
    }
    if(sc<bs){bs=sc;best=s}
  }
  a.fx=[];
  for(let c=0;c<courts;c++){const s=best.slice(c*4,c*4+4);a.fx.push({t:[[s[0],s[1]],[s[2],s[3]]],done:false,g:[0,0]})}
  a.cur=0;
}
/** Buat state match untuk pertandingan ke-a.cur pada ronde berjalan. */
function matchFrom(a){
  const t=a.fx[a.cur].t;
  const s=mk("ame",3,DS,[t[0][0],t[0][1],t[1][0],t[1][1]]);
  s.ame=a;return s;
}
/** Mulai turnamen Americano baru. Mengembalikan state match pertama. */
function newAme(players,total){
  const a={players,total,round:0,fx:[],rest:[],cur:0,pts:{},mp:{},w:{},pr:{},op:{},finished:false};
  players.forEach(p=>{a.pts[p]=0;a.mp[p]=0;a.w[p]=0});
  genRound(a);return matchFrom(a);
}
/** Dipanggil saat tombol "Simpan & lanjut": masukkan game tiap tim jadi poin individu, lalu
 * lanjut ke match berikutnya / ronde berikutnya / selesai. */
function saveMatch(){
  stack.push(clone(S));
  const a=S.ame,f=a.fx[a.cur];
  f.done=true;f.g=S.g.slice();
  for(let i=0;i<2;i++)f.t[i].forEach(p=>{a.pts[p]+=S.g[i];a.mp[p]++;if(S.winner===i)a.w[p]++});
  a.pr[pk(f.t[0][0],f.t[0][1])]=(a.pr[pk(f.t[0][0],f.t[0][1])]||0)+1;
  a.pr[pk(f.t[1][0],f.t[1][1])]=(a.pr[pk(f.t[1][0],f.t[1][1])]||0)+1;
  f.t[0].forEach(x=>f.t[1].forEach(y=>{a.op[pk(x,y)]=(a.op[pk(x,y)]||0)+1}));
  const nx=a.fx.findIndex(x=>!x.done);
  if(nx>=0){a.cur=nx;S=matchFrom(a)}
  else if(a.round+1>=a.total){a.finished=true;save();render();openLb();return}
  else{a.round++;genRound(a);S=matchFrom(a)}
  save();render();
}
/** Urutkan pemain: poin ↓, menang ↓, main ↑. Mengembalikan baris + field rank (seri = peringkat sama). */
function ranking(a){
  const rows=a.players.map(p=>({p,pts:a.pts[p],w:a.w[p],m:a.mp[p]})).sort((x,y)=>y.pts-x.pts||y.w-x.w||x.m-y.m);
  rows.forEach((r,i)=>{r.rank=i>0&&rows[i-1].pts===r.pts&&rows[i-1].w===r.w?rows[i-1].rank:i+1});
  return rows;
}
/** Tampilkan popup peringkat (dan susunan match ronde ini). Dipakai juga sebagai hasil akhir. */
function openLb(){
  const a=S.ame;if(!a)return;
  const medal=["🥇","🥈","🥉"];
  let h='<h2>'+(a.finished?"🏆 Hasil akhir":"Peringkat")+'</h2><p>'+(a.finished?"Tennis Americano selesai · "+a.total+" ronde":"Ronde "+(a.round+1)+" dari "+a.total)+'</p>';
  h+='<div class="lr h"><div>#</div><div style="text-align:left">Pemain</div><div>Poin</div><div>Menang</div><div>Main</div></div>';
  ranking(a).forEach(r=>{
    h+='<div class="lr'+(r.rank===1&&r.m>0?" top1":"")+'"><div>'+(r.m>0&&r.rank<=3?medal[r.rank-1]:r.rank)+'</div><div class="nmL">'+esc(r.p)+'</div><div class="pt">'+r.pts+'</div><div>'+r.w+'</div><div>'+r.m+'</div></div>';
  });
  if(!a.finished){
    h+='<div class="fxl"><b>Ronde '+(a.round+1)+'</b><br>';
    a.fx.forEach((f,i)=>{
      h+=(f.done?"✓ ":(i===a.cur?"▶ ":"· "))+esc(f.t[0].join("/"))+" vs "+esc(f.t[1].join("/"))+(f.done?" <b>"+f.g[0]+"–"+f.g[1]+"</b>":"")+"<br>";
    });
    if(a.rest.length)h+="Istirahat: "+esc(a.rest.join(", "));
    h+='</div>';
  }
  h+='<div style="margin-top:16px">'+(a.finished?'<button class="m g" id="lbnew">Selesai</button>':'')+'<button class="m" id="lbx">Tutup</button></div>';
  $("lbbody").innerHTML=h;
  $("lbx").onclick=()=>$("lb").classList.remove("show");
  if(a.finished)$("lbnew").onclick=()=>
/* ============================================================
 * 8. MULAI APLIKASI
 * Tampilkan halaman awal (splash menutupinya selama ±2 detik).
 * ============================================================ */
show("home");
  $("lb").classList.add("show");
}

/* ============================================================
 * 3. LOGIKA SKOR
 * Aturan hitung poin/game/set ada di point() dan winGame(). Aturan deuce: S.dl (0 bebas, 2 maks 2 deuce, 1 Sudden).
 * ============================================================ */

/** Tambah 1 poin untuk sisi i (0/1). Alur: simpan snapshot undo → hitung (tiebreak / deuce / poin penentu) → winGame bila game selesai. */
function point(i) {
  if (S.over) return;
  stack.push(clone(S)); // snapshot untuk tombol Urungkan
  const o = 1 - i;      // lawan

  if (S.dp) {
    // Poin penentu (Sudden / setelah deuce terakhir): pemenang poin ini langsung menang game
    winGame(i);
  } else {
    S.p[i]++;
    if (S.tb) {
      // Tiebreak (mode std): sampai 7 poin dengan selisih 2
      if (S.p[i] >= 7 && S.p[i] - S.p[o] >= 2) winGame(i);
      else S.server = (S.tbStart + Math.floor((S.p[0] + S.p[1] + 1) / 2)) % 2; // servis ganti tiap 2 poin
    } else if (S.p[i] >= 4 && S.p[i] - S.p[o] >= 2) {
      // Game biasa: 4 poin dengan selisih 2
      winGame(i);
    } else if (S.dl && S.p[i] >= 3 && S.p[i] === S.p[o]) {
      // Deuce dengan batas (S.dl): hitung deuce; bila batas tercapai, poin berikutnya menentukan
      S.dc++;
      if (S.dc >= S.dl) S.dp = true;
    }
  }
  try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} // getar singkat
  save();
  render();
}

/** Sisi i memenangkan game. Mode dbl/ame: hitung game, ganti servis, cek akhir match (4 game / game penentu).
 * Mode std: cek set, tiebreak 6-6, best-of. */
function winGame(i) {
  const o = 1 - i;

  // ---- Mode dbl / ame: match = 4 game, tiap pemain servis bergantian ----
  if (dbl()) {
    S.g[i]++;
    S.p = [0, 0]; S.dc = 0; S.dp = false; // reset game berikutnya
    if (S.final) { S.over = true; S.winner = i; return; } // game penentu ekstra selesai
    S.gp++;
    if (S.gp >= 4) {
      if (S.g[0] !== S.g[1]) {
        S.over = true;                       // game terbanyak menang
        S.winner = S.g[0] > S.g[1] ? 0 : 1;
      } else {
        S.final = true; S.dp = true;         // seri 2-2 → satu poin penentu
        S.srv = 0; S.server = 0;
      }
    } else {
      S.srv = S.gp;                          // pemain servis berikutnya
      S.server = S.srv % 2;
    }
    return;
  }

  // ---- Mode std: game → set → match ----
  const wasTb = S.tb;
  S.g[i]++;
  S.p = [0, 0]; S.dc = 0; S.dp = false;
  const setWon = wasTb || (S.g[i] >= 6 && S.g[i] - S.g[o] >= 2); // 6 game selisih 2, atau menang tiebreak
  if (setWon) {
    S.hist.push([S.g[0], S.g[1]]);           // simpan skor set
    S.sw[i]++;
    S.g = [0, 0];
    S.server = wasTb ? 1 - S.tbStart : 1 - S.server;
    S.tb = false;
    if (S.sw[i] >= Math.ceil(S.bo / 2)) { S.over = true; S.winner = i; } // cukup set untuk menang
  } else if (S.g[0] === 6 && S.g[1] === 6) {
    S.tb = true;                             // 6-6 → tiebreak
    S.tbStart = 1 - S.server;
    S.server = 1 - S.server;
  } else {
    S.server = 1 - S.server;                 // ganti servis tiap game
  }
}

/** Teks poin besar di tombol sisi i: 0/15/30/40/AD (atau angka biasa saat tiebreak). */
function label(i){
  const a=S.p[i],b=S.p[1-i];
  if(S.tb)return String(a);
  if(a>=3&&b>=3){if(a===b)return"40";return a>b?"AD":"40"}
  return["0","15","30","40"][a];
}
/** Teks kecil di bawah poin: Deuce x/y, Advantage, Poin penentu, Tiebreak. */
function sub(i){
  if(S.over)return"";
  if(S.tb)return"Tiebreak";
  const a=S.p[i],b=S.p[1-i];
  if(S.dp)return S.final?"Poin penentu pertandingan":"Poin penentu";
  if(a>=3&&b>=3){
    if(a===b)return S.dl?"Deuce "+S.dc+"/"+S.dl:"Deuce";
    return a>b?"Advantage":"";
  }
  return"";
}
/* ============================================================
 * 4. TAMPILAN LAYAR PERMAINAN
 * render() menggambar papan skor, status, dua tombol tap, dan popup hasil.
 * ============================================================ */

/** Gambar ulang SELURUH layar permainan dari state S (papan skor, status, tombol, popup hasil). */
function render(){
  let h="";
  if(dbl()){
    h+='<div class="row d h"><div>Tim</div><div class="c">Game</div></div>';
    for(let i=0;i<2;i++)h+='<div class="row d"><div class="nm"><span class="dot'+(S.server===i&&!S.over?" on":"")+'"></span><span>'+esc(tn(i))+'</span></div><div class="c cur">'+S.g[i]+'</div></div>';
  }else{
    h+='<div class="row h"><div>Pemain</div>';
    for(let k=0;k<4;k++)h+='<div class="c">'+(k<S.hist.length?"S"+(k+1):k===S.hist.length&&!S.over?"S"+(k+1):"")+'</div>';
    h+='<div class="c">Set</div></div>';
    for(let i=0;i<2;i++){
      h+='<div class="row"><div class="nm"><span class="dot'+(S.server===i&&!S.over?" on":"")+'"></span><span>'+esc(S.names[i])+'</span></div>';
      const cells=S.hist.slice(-3).map(x=>x[i]);
      if(!S.over)cells.push(S.g[i]);
      while(cells.length<4)cells.unshift("");
      cells.slice(-4).forEach((v,idx,arr)=>{h+='<div class="c'+(idx===arr.length-1&&!S.over?" cur":"")+'">'+v+'</div>'});
      h+='<div class="c" style="font-weight:700">'+S.sw[i]+'</div></div>';
    }
  }
  $("board").innerHTML=h;
  if(dbl()){
    const ord=[0,1,2,3].map(k=>{const q=S.pl[k%2];return q[Math.floor(k/2)%q.length]});
    const line=ord.map((n,k)=>k===S.srv&&!S.over?"<b>"+esc(n)+"</b>":esc(n)).join(" → ");
    let st="";
    if(ame()){
      const a=S.ame,dn=a.fx.filter(f=>f.done).length;
      st+="<b>Ronde "+(a.round+1)+"/"+a.total+"</b> · Match "+Math.min(dn+1,a.fx.length)+"/"+a.fx.length+" · ";
      st+=S.final?"<b>Poin penentu</b>":"Game "+Math.min(S.gp+1,4)+"/4";
      if(a.rest.length)st+="<br>Istirahat: "+esc(a.rest.join(", "));
    }else st+=S.over?"Selesai · Double cepat":(S.final?"<b>Game seri · satu poin penentu</b>":"Game "+(S.gp+1)+" dari 4 · "+(S.dl===1?"tanpa deuce":"maks 2 deuce"));
    $("status").innerHTML=st+"<br>Urutan servis: "+line;
  }else{
    $("status").textContent=S.over?"Pertandingan selesai":(S.tb?"Tiebreak · ":"")+"Server: "+S.names[S.server]+" · Best of "+S.bo+" · Set "+(S.hist.length+1);
  }
  [["pa",0],["pb",1]].forEach(([id,i])=>{
    $(id).innerHTML='<div class="n">'+esc(tn(i))+'</div><div class="p">'+label(i)+'</div><div class="t">'+(sub(i)||"&nbsp;")+'</div>';
  });
  $("undo").disabled=!stack.length;
  $("lbbtn").style.display=ame()?"":"none";
  const fin=ame()&&S.ame.finished;
  $("win").classList.toggle("show",S.over&&!fin);
  $("again").textContent=ame()?"Simpan & lanjut":"Main lagi";
  if(S.over){
    $("wt").textContent="🏆 "+tn(S.winner)+" menang!";
    $("ws").textContent=dbl()?"Game "+S.g[0]+"–"+S.g[1]+(ame()?" · skor masuk ke peringkat":""):S.hist.map(x=>x[0]+"–"+x[1]).join("  ·  ");
  }
}

/** Kembalikan state ke snapshot terakhir. */
function undo() {
  if (!stack.length) return;
  S = stack.pop();
  $("lb").classList.remove("show");
  save();
  render();
}
$("pa").onclick=()=>point(0);
$("pb").onclick=()=>point(1);
$("undo").onclick = undo;
$("undo2").onclick = undo;
$("lbbtn").onclick=openLb;
$("serve").onclick=()=>{
  if(S.over)return;
  stack.push(clone(S));
  if(dbl()){S.srv=(S.srv+1)%4;S.server=S.srv%2}
  else{S.server=1-S.server;if(S.tb)S.tbStart=1-S.tbStart}
  save();render();
};
/** Mulai pertandingan baru mode std/dbl. dl (opsional, hanya dbl): 1 = Sudden, 2 = Deuce. */
function startNew(mode, bo, std, d, dl) {
  stack = [];
  S = mk(mode, bo, std, d);
  if (dl) S.dl = dl; // 1 = Sudden, 2 = Deuce (khusus mode dbl)
  hasSaved = true;
  save();
  show("play");
}
$("again").onclick=()=>{
  if(ame())return saveMatch();
  startNew(S.mode,S.bo,S.names,[S.pl[0][0],S.pl[0][1],S.pl[1][0],S.pl[1][1]],S.dl);
};

  const e=$("e"+k);if(!e)return;
  e.textContent="Spasi, koma, dan enter tidak boleh dipakai di mode single.";
  clearTimeout(flashT);flashT=setTimeout(check,2200);
}
/** Validasi form pengaturan: isi pesan error merah dan kunci/buka tombol Mulai. */
function check(){
  const errs=["",""];let ok=true;
  if(pick==="ame"){
    const n=Object.keys(ps(D.names).reduce((o,x)=>(o[x.toLowerCase()]=1,o),{})).length;
    if(n<4){errs[0]="Tambahkan "+(4-n)+" nama lagi (minimal 4 pemain).";ok=false}
  }else if(D.kind==="single"){
    [0,1].forEach(k=>{if(!D.s[k]){errs[k]="Isi nama pemain "+(k+1)+".";ok=false}});
  }else{
    [0,1].forEach(k=>{
      const n=ps(D.t[k]).length,T=k?"B":"A";
      if(n===0){errs[k]="Isi 2 nama untuk tim "+T+", pisahkan dengan koma.";ok=false}
      else if(n===1){errs[k]="Tambahkan 1 nama lagi agar tim "+T+" lengkap.";ok=false}
      else if(n>2){errs[k]="Satu tim maksimal 2 nama. Hapus "+(n-2)+" nama.";ok=false}
    });
  }
  [0,1].forEach(k=>{const e=$("e"+k);if(e)e.textContent=errs[k]});
  const g=$("mgo");if(g){g.disabled=!ok;g.style.opacity=ok?"":".4"}
}

/** Terjemahkan 1 potong teks ID → EN: cek kamus E dulu, lalu pola R satu per satu. */
function tr(s){
  const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/),c=m[2];
  if(E[c]!==undefined)return m[1]+E[c]+m[3];
  let o=c;R.forEach(([re,x])=>{o=o.replace(re,x)});
  return m[1]+o+m[3];
}
const OR=new WeakMap(),LA=new WeakMap();
/** Terapkan bahasa ke seluruh teks di layar (teks asli Indonesia disimpan di OR supaya bisa dibalikkan). */
function applyLang(){
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode?n.parentNode.nodeName:"";return p==="SCRIPT"||p==="STYLE"||p==="TEXTAREA"?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
  let n;
  while(n=w.nextNode()){
    let o=OR.get(n);
    if(o===undefined||n.nodeValue!==LA.get(n)){o=n.nodeValue;OR.set(n,o)}
    const v=lang==="en"?tr(o):o;
    if(v!==n.nodeValue)n.nodeValue=v;
    LA.set(n,v);
  }
  document.querySelectorAll("[placeholder]").forEach(el=>{
    if(!el.dataset.po)el.dataset.po=el.getAttribute("placeholder");
    el.setAttribute("placeholder",lang==="en"?tr(el.dataset.po):el.dataset.po);
  });
}
["render","renderMenu","openLb","openEnd","check","flash"].forEach(nm=>{
  const f=window[nm];
  window[nm]=function(){const r=f.apply(this,arguments);applyLang();return r};
});
$("lang").onclick=()=>{
  lang=lang==="en"?"id":"en";
  try{localStorage.setItem("skor-lang",lang)}catch(e){}
  $("lang").dataset.l=lang;document.documentElement.lang=lang;
  if(screen==="play")render();else renderMenu();
  if($("lb").classList.contains("show")||$("cfg").classList.contains("show"))applyLang();
};
$("lang").dataset.l = lang;
document.documentElement.lang = lang;

/** Sembunyikan splash dengan fade-out lalu hapus dari halaman. */
function hideSplash() {
  const s = $("splash");
  if (!s || s.classList.contains("out")) return;
  s.classList.add("out");              // fade-out (CSS .out)
  setTimeout(() => s.remove(), 600);
}
$("splash").onclick = hideSplash; // tap = lewati
setTimeout(hideSplash, 2000);      // otomatis hilang setelah 2 detik
show("home");
</script>
